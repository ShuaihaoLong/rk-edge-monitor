# RK3588 局域网监控：应用向本机 RTSP 发布，浏览器通过 WHEP 读取。
logLevel: info
logDestinations: [stdout]
authMethod: internal
authInternalUsers:
  - user: any
    ips: [127.0.0.1, '::1']
    permissions:
      - action: publish
        path: camera
      - action: playback
        path: camera
  - user: any
    ips: []
    permissions:
      - action: read
        path: camera
api: false
metrics: false
pprof: false
playback: true
playbackAddress: 127.0.0.1:9996
playbackAllowOrigins: []
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: false
hls: false
srt: false
moq: false
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigins: ['http://192.168.100.11:9000', 'http://127.0.0.1:9000']
webrtcTrustedProxies: [127.0.0.1]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ''
webrtcIPsFromInterfaces: false
# 板卡地址改变时，同时更新此地址和上面的网页来源。
webrtcAdditionalHosts: [192.168.100.11]
webrtcICEServers2: []
paths:
  camera:
    source: publisher
    record: true
    recordPath: /userdata/rkmon-video/%path/%Y-%m-%d/%H-%M-%S-%f
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 1m
    recordDeleteAfter: 0s
    runOnRecordSegmentCreate: python3 /opt/rkmon/lib/recording/notify.py segment_open
    runOnRecordSegmentComplete: python3 /opt/rkmon/lib/recording/notify.py segment_complete
