server {
    listen 9000;
    server_name _;
    root /opt/rkmon/web;
    index index.html;
    client_max_body_size 512m;

    # 浏览器只访问同源地址，MQTT WebSocket 监听器不直接暴露到局域网。
    location /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 只公开原子更新的检测快照，不暴露整个运行目录。
    location = /api/detections {
        alias /run/rkmon/detections.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/api/(recordings(?:/.*)?|playback)$ {
        proxy_pass http://127.0.0.1:9010;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/api/(ads(?:/.*)?|display/mode)$ {
        proxy_pass http://127.0.0.1:9010;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 512m;
        add_header Cache-Control "no-store" always;
    }

    location = /recording-media/get {
        proxy_pass http://127.0.0.1:9996/get;
        proxy_buffering off;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    location /_recordings/ {
        internal;
        alias /userdata/rkmon-video/;
        add_header X-Content-Type-Options nosniff always;
    }

    location /_ads/ {
        internal;
        alias /userdata/rkmon-ads/videos/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # 仅转发读取会话，避免向网页暴露媒体发布入口。
    location ~ ^/rtc/camera/whep(?:/[^/]+)?$ {
        rewrite ^/rtc/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^(/camera/whep.*)$ /rtc$1;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
}
