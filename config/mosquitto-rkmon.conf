# 中心节点 broker。持久化沿用 Ubuntu 主配置，避免在 conf.d 重复声明全局项。
# 1883 供局域网设备发布，9001 仅供本机 Nginx 代理网页订阅。

listener 1883 0.0.0.0
protocol mqtt

listener 9001 127.0.0.1
protocol websockets
# 旧版 libwebsockets 可能优先建立 IPv6 通配 socket；接口绑定确保只能从本机访问。
socket_domain ipv4
bind_interface lo

# 当前阶段用于可信局域网；公网部署前需要启用账号、ACL 和 TLS。
allow_anonymous true
