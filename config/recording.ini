[recording]
root = /userdata/rkmon-video
ads_root = /userdata/rkmon-ads
event_socket = /run/rkmon-recording/events.sock
host = 127.0.0.1
port = 9010
timezone = Asia/Shanghai
retain_days = 7
reserve_mib = 1024
; 分区总容量的最低空闲比例，与 reserve_mib 取较大值；清理额外留出 1% 余量。
reserve_percent = 40
; 0 表示仅按保留天数和剩余空间清理；单位 GiB。
max_gib = 0
