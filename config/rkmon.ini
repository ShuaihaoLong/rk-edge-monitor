; 配置在启动时读取；修改后重启程序生效。
; 节名和键名区分大小写。注释单独占一行，值不加引号。
; 文件路径可使用绝对路径；相对路径以本文件所在目录为基准。

[app]
control_mailbox_capacity = 64

[logging]
console = true
file = ../logs/rkmon.log
level = info
max_file_size = 5242880
rotated_files = 3

[camera]
enabled = true
device = /dev/v4l/by-id/usb-SYD_USB_Camera_200901010001-video-index0
width = 1920
height = 1080
format = MJPG
fps = 30
buffer_count = 4
queue_capacity = 4
poll_timeout_ms = 1000
max_consecutive_timeouts = 5

[video]
enabled = true
timeout_ms = 2000
queue_capacity = 4

[stream]
enabled = true
url = rtsp://127.0.0.1:8554/camera
bitrate = 4000000
gop = 30
timeout_ms = 5000

[ai]
enabled = true
model = ../models/yolov8n.rknn
labels = ../models/coco_80_labels_list.txt
result = /run/rkmon/detections.json
fps = 10
