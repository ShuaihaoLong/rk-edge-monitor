<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设备监控</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/reader.js"></script>
  <script defer src="vendor/mqtt.min.js"></script>
  <script defer src="player.js"></script>
  <script defer src="detections.js"></script>
  <script defer src="device-status.js"></script>
  <script defer src="display-control.js"></script>
</head>
<body>
  <main>
    <aside>
      <section aria-label="设备状态">
        <header><h1>设备状态</h1><span id="mqtt-state">连接中</span></header>
        <div id="device-list"></div>
        <p id="device-empty" class="hint">等待设备上线…</p>
      </section>
      <section class="recognition" aria-label="识别日志">
        <header><h1>识别日志</h1><span id="ai-state">连接中</span></header>
      <p class="hint">显示最近的检测结果</p>
      <ol id="detection-log" aria-label="最近识别记录"></ol>
      <p id="log-empty">等待识别结果…</p>
      </section>
    </aside>
    <div class="monitor-area">
      <nav class="monitor-nav" aria-label="监控导航">
        <span class="mode-switch" aria-label="本地屏幕显示模式">
          <button type="button" data-display-mode="ad">播放广告</button>
          <button type="button" data-display-mode="live">实时监控</button>
        </span>
        <a href="ads.html">广告管理 →</a>
        <a href="recordings.html">录像回放 →</a>
      </nav>
      <section id="viewport" aria-label="实时监控">
        <video id="monitor" autoplay muted playsinline aria-label="摄像头实时画面"></video>
        <canvas id="boxes" aria-hidden="true"></canvas>
        <p id="playback-fps" aria-label="浏览器播放帧率">播放帧率 —</p>
        <label class="toggle"><input id="show-boxes" type="checkbox" checked><span>显示识别框</span></label>
        <p id="status" role="status">正在连接摄像头…</p>
      </section>
      <section class="environment" aria-label="环境温湿度">
        <header><h1>环境温湿度</h1><span class="hint">DHT11 · 实时采样</span></header>
        <div id="sensor-list"></div>
        <p id="sensor-empty" class="hint">等待温湿度数据…</p>
      </section>
    </div>
  </main>
</body>
</html>
